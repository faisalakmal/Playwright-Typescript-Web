name: Playwright UI Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        default: dev
        options: [dev, staging, production]

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}-${{ inputs.environment || 'dev' }}
  cancel-in-progress: true

jobs:
  ui-tests:
    environment: ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      TEST_ENV: ${{ inputs.environment || 'dev' }}
      BASE_URL: ${{ vars.BASE_URL }}
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Generate Allure report
        if: always()
        run: npm run report:allure
      - name: Upload HTML report and debugging artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-report-${{ env.TEST_ENV }}
          path: |
            playwright-report/
            test-results/
            allure-results/
            allure-report/
          retention-days: 14
          if-no-files-found: warn
